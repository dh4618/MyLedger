<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ledger</title>

    <!-- Home-screen icon on iOS. Must be a PNG; iOS ignores SVG here. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Opens full-screen (no Safari chrome) once added to the Home Screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ledger" />
    <meta name="theme-color" content="#EDF0EE" />

    <script>
      // Applies the saved theme before React boots, so the app opens in the right
      // colours instead of flashing the default palette on every launch. Runs after
      // the meta tags above so it can update them in place.
      //
      // Keep this map in sync with THEMES in src/themes.jsx — [background, statusBar].
      // statusBar is 'default' for dark text, 'black' for light text, picked so the
      // clock stays legible against each palette.
      (function () {
        var THEMES = {
          sprout: ['#EDF0EE', 'default'],
          mochi:  ['#FDF2F4', 'default'],
          ember:  ['#FBF3EA', 'default'],
          pixel:  ['#F4F1FB', 'default'],
          cloudy: ['#EFF5FC', 'default'],
          luna:   ['#171B26', 'black']
        };
        var id = 'sprout';
        try {
          var saved = localStorage.getItem('ledger-theme');
          if (saved && THEMES[saved]) id = saved;
        } catch (e) {
          // Storage disabled (private browsing); the default is fine.
        }
        var background = THEMES[id][0];
        var statusBar = THEMES[id][1];

        var root = document.documentElement;
        root.setAttribute('data-theme', id);
        // Covers the moment before the stylesheet has applied.
        root.style.background = background;

        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) themeMeta.setAttribute('content', background);
        // iOS reads this when it builds the web view, which may already have
        // happened by now — so this is best-effort and reliably correct from the
        // launch after a theme change.
        var barMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (barMeta) barMeta.setAttribute('content', statusBar);
      })();
    </script>
  </head>
  <body style="margin:0">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
